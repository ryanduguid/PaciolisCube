name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev ruff check pacioliscube tests
      - run: uv run --locked --extra dev mypy pacioliscube

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    needs: lint
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"   # the declared floor
            fetch_depth: 1
          - os: ubuntu-latest
            python: "3.12"
            fetch_depth: 1
          - os: ubuntu-latest
            python: "3.13"
            fetch_depth: 0   # diff-cover compares against origin/main
          - os: ubuntu-latest
            python: "3.14"
            fetch_depth: 1
          - os: windows-latest
            python: "3.12"   # where path handling and the ANSI code page diverge
            fetch_depth: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.13'
        run: uv run --locked --extra dev --python ${{ matrix.python }} pytest -q
      - name: run tests with scoped branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: >-
          uv run --locked --extra dev --python ${{ matrix.python }}
          coverage run --branch --source=pacioliscube.validate -m pytest -q
      - name: require complete changed-line coverage in validation logic
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv run --locked --extra dev --python ${{ matrix.python }} coverage xml --include="pacioliscube/validate.py" -o coverage.xml
          uv run --locked --extra dev --python ${{ matrix.python }} diff-cover coverage.xml --compare-branch=origin/main --branch-coverage --fail-under=100

  dependency-audit:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict

  package:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv build
      # A wheel that installs but cannot find its own model tree is a broken release,
      # so the real command line runs against the real model here, not a stub.
      - name: install the wheel into a clean environment and run the real command line
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --no-index --find-links dist pacioliscube
          /tmp/wheelenv/bin/pacioliscube validate model
      # An sdist missing tests or fixtures still passes a source checkout run,
      # so the shipped tests are run from the extracted sdist as well.
      - name: run the shipped tests out of the sdist
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install "pytest>=8" "hypothesis==6.168.0"
          cd /tmp/sdist && /tmp/sdistenv/bin/python -m pytest -q

  tests-gates:
    # The one context branch protection requires from this workflow. It runs
    # on every event and fails unless every job it needs succeeded, and its
    # last step fails when a job in this file is missing from needs, so a new
    # job or matrix leg is enforced without a protection change.
    needs: [lint, test, dependency-audit, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every needed job to succeed
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, value in results.items() if value["result"] != "success"]
          if failed:
              raise SystemExit("Jobs did not succeed: " + ", ".join(failed))
      - name: Check out the workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Require needs to list every other job in this file
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, re
          text = open(".github/workflows/ci.yml", encoding="utf-8").read()
          block = re.split(r"(?m)^(?=[^\s#])", text.split("\njobs:\n", 1)[1], maxsplit=1)[0]
          key = re.compile(r"""(["']?)([A-Za-z_][\w-]*)\1[ \t]*:(?:[ \t]|$)""")
          jobs = set()
          for line in block.splitlines():
              if line.startswith("  ") and line[2:3] not in ("", " ", "#"):
                  match = key.match(line[2:])
                  if match is None:
                      raise SystemExit("Cannot read the job key " + repr(line) + "; the gate check needs updating")
                  jobs.add(match[2])
          if "tests-gates" not in jobs:
              raise SystemExit("Could not read the job list; the gate check needs updating")
          missing = sorted(jobs - {"tests-gates"} - set(json.loads(os.environ["RESULTS"])))
          if missing:
              raise SystemExit("Add these jobs to needs: " + ", ".join(missing))
