name: mutation pilot

on:
  push:
    branches: [codex/wave5-properties-mutation]

permissions:
  contents: read

jobs:
  evaluate-expression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.5"
      - run: uv sync --locked --extra dev --python 3.12
      - name: run the bounded calculation mutation pilot
        run: |
          status=0
          uv run --locked --extra dev --python 3.12 mutmut run || status=$?
          echo "mutmut run exit: $status"
          uv run --locked --extra dev --python 3.12 mutmut results || true
          uv run --locked --extra dev --python 3.12 mutmut show all \
            pacioliscube/evaluate.py || true
